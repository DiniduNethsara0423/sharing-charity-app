<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0f0f11;
    --bg2:      #18181b;
    --bg3:      #1e1e23;
    --bg4:      #26262d;
    --border:   rgba(255,255,255,0.07);
    --border2:  rgba(255,255,255,0.12);
    --border3:  rgba(255,255,255,0.18);
    --text:     #f4f4f5;
    --text2:    #a1a1aa;
    --text3:    #71717a;
    --accent:   #a78bfa;
    --accent2:  #7c3aed;
    --accent3:  #6d28d9;
    --green:    #34d399;
    --amber:    #fbbf24;
    --red:      #f87171;
    --blue:     #60a5fa;
    --font:     'DM Sans', sans-serif;
    --mono:     'DM Mono', monospace;
    --r:        8px;
    --r-lg:     12px;
    --r-xl:     16px;
    --sidebar:  220px;
    --topbar:   56px;
    --shadow:   0 4px 24px rgba(0,0,0,0.4);
  }

  html, body { height: 100%; }

  body {
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  /* ─── Scrollbar ─────────────────────────────────────────── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 99px; }

  /* ─── Topbar ─────────────────────────────────────────────── */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--topbar);
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    z-index: 100;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.3px;
    color: var(--text);
    text-decoration: none;
  }

  .brand-mark {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    color: white;
    flex-shrink: 0;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .avatar-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .avatar {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    font-weight: 600;
    color: white;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }

  .avatar-info { line-height: 1.2; }
  .avatar-name { font-size: 13px; font-weight: 500; }
  .avatar-role { font-size: 11px; color: var(--text3); }

  .btn-icon {
    width: 34px; height: 34px;
    background: transparent;
    border: 1px solid var(--border2);
    border-radius: var(--r);
    color: var(--text2);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 16px;
    flex-shrink: 0;
  }
  .btn-icon:hover { background: var(--bg3); color: var(--text); border-color: var(--border3); }

  /* ─── Layout ─────────────────────────────────────────────── */
  .app-layout {
    display: flex;
    padding-top: var(--topbar);
    min-height: 100vh;
  }

  /* ─── Sidebar ────────────────────────────────────────────── */
  .sidebar {
    position: fixed;
    top: var(--topbar);
    left: 0;
    bottom: 0;
    width: var(--sidebar);
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 12px 10px;
    overflow-y: auto;
    z-index: 90;
  }

  .nav-section-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text3);
    padding: 8px 12px 4px;
    margin-top: 8px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 12px;
    border-radius: var(--r);
    font-size: 13.5px;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.15s;
    border: none;
    background: none;
    font-family: var(--font);
    width: 100%;
    text-align: left;
    position: relative;
    text-decoration: none;
  }
  .nav-item i { font-size: 17px; flex-shrink: 0; }
  .nav-item:hover { background: var(--bg3); color: var(--text); }
  .nav-item.active {
    background: rgba(167,139,250,0.12);
    color: var(--accent);
  }
  .nav-item.active::before {
    content: '';
    position: absolute;
    left: 0; top: 6px; bottom: 6px;
    width: 3px;
    background: var(--accent);
    border-radius: 0 3px 3px 0;
  }

  .nav-badge {
    margin-left: auto;
    background: rgba(167,139,250,0.15);
    color: var(--accent);
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 20px;
  }

  .sidebar-footer {
    margin-top: auto;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  /* ─── Main content ───────────────────────────────────────── */
  .main {
    margin-left: var(--sidebar);
    flex: 1;
    padding: 28px 32px;
    min-height: calc(100vh - var(--topbar));
    overflow-x: hidden;
  }

  .page-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .page-title-wrap {}
  .page-title {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  .page-sub {
    font-size: 13px;
    color: var(--text3);
    margin-top: 3px;
  }

  /* ─── Buttons ────────────────────────────────────────────── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: var(--r);
    cursor: pointer;
    transition: all 0.15s;
    border: none;
    white-space: nowrap;
    text-decoration: none;
  }
  .btn i { font-size: 15px; }

  .btn-primary {
    background: var(--accent2);
    color: white;
  }
  .btn-primary:hover { background: var(--accent3); }
  .btn-primary:active { transform: scale(0.98); }

  .btn-secondary {
    background: var(--bg3);
    color: var(--text2);
    border: 1px solid var(--border2);
  }
  .btn-secondary:hover { background: var(--bg4); color: var(--text); }

  .btn-ghost {
    background: transparent;
    color: var(--text2);
    border: 1px solid var(--border2);
  }
  .btn-ghost:hover { background: var(--bg3); color: var(--text); }

  .btn-danger {
    background: transparent;
    color: var(--red);
    border: 1px solid rgba(248,113,113,0.2);
    font-size: 12px;
    padding: 6px 12px;
  }
  .btn-danger:hover { background: rgba(248,113,113,0.08); border-color: rgba(248,113,113,0.35); }

  .btn-sm {
    font-size: 12px;
    padding: 5px 12px;
  }

  .btn-full { width: 100%; justify-content: center; padding: 10px 16px; }

  /* ─── Stat cards ─────────────────────────────────────────── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 20px;
    transition: border-color 0.2s, transform 0.2s;
  }
  .stat-card:hover { border-color: var(--border3); transform: translateY(-1px); }

  .stat-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .stat-icon {
    width: 38px; height: 38px;
    border-radius: var(--r);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .si-purple { background: rgba(167,139,250,0.12); color: var(--accent); }
  .si-green  { background: rgba(52,211,153,0.12);  color: var(--green); }
  .si-amber  { background: rgba(251,191,36,0.12);  color: var(--amber); }
  .si-blue   { background: rgba(96,165,250,0.12);  color: var(--blue); }

  .stat-trend-pill {
    font-size: 11px;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 20px;
    background: rgba(52,211,153,0.1);
    color: var(--green);
  }
  .stat-trend-pill.down { background: rgba(248,113,113,0.1); color: var(--red); }

  .stat-num {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -1px;
    font-family: var(--mono);
    color: var(--text);
    line-height: 1;
  }
  .stat-label {
    font-size: 12px;
    color: var(--text3);
    margin-top: 5px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* ─── Cards / panels ─────────────────────────────────────── */
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    overflow: hidden;
  }

  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .card-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title i { font-size: 16px; color: var(--text3); }

  .card-body { padding: 20px; }

  /* ─── Table ──────────────────────────────────────────────── */
  .table-wrap { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    font-size: 11px;
    font-weight: 600;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 11px 20px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  tbody td {
    padding: 13px 20px;
    font-size: 13px;
    color: var(--text);
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { transition: background 0.1s; }
  tbody tr:hover td { background: rgba(255,255,255,0.02); }

  /* ─── Badges ─────────────────────────────────────────────── */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 500;
    padding: 3px 9px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .badge-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .badge-active  { background: rgba(52,211,153,0.12);  color: var(--green); }
  .badge-pending { background: rgba(251,191,36,0.10);  color: var(--amber); }
  .badge-inactive{ background: rgba(113,113,122,0.15); color: var(--text3); }

  .id-chip {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text3);
    background: var(--bg3);
    padding: 2px 8px;
    border-radius: 5px;
  }

  /* ─── Form ───────────────────────────────────────────────── */
  .form-panel {
    width: 290px;
    flex-shrink: 0;
    background: var(--bg3);
    border-right: 1px solid var(--border);
    padding: 20px;
  }

  .form-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 18px;
    display: flex;align-items:center;gap:8px;
  }
  .form-title i { font-size: 16px; color: var(--accent); }

  .form-group { margin-bottom: 14px; }

  .form-label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 6px;
  }

  .form-input,
  .form-textarea,
  .form-select {
    width: 100%;
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: var(--r);
    padding: 8px 12px;
    font-family: var(--font);
    font-size: 13px;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    appearance: none;
  }
  .form-input:focus,
  .form-textarea:focus,
  .form-select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(167,139,250,0.15);
  }
  .form-input::placeholder,
  .form-textarea::placeholder { color: var(--text3); }
  .form-input[type="file"] { padding: 6px 10px; font-size: 12px; cursor: pointer; }

  .form-textarea { resize: vertical; min-height: 80px; line-height: 1.5; }

  .form-actions { display: flex; gap: 8px; margin-top: 18px; }

  /* ─── Split layout (form + table) ───────────────────────── */
  .split-layout { display: flex; min-height: 420px; }
  .split-list { flex: 1; overflow: hidden; }

  /* ─── Chart bars ─────────────────────────────────────────── */
  .chart { display: flex; flex-direction: column; gap: 10px; }
  .chart-row { display: flex; align-items: center; gap: 12px; }
  .chart-label { font-size: 12px; color: var(--text3); width: 32px; flex-shrink: 0; }
  .chart-track { flex: 1; background: var(--bg3); border-radius: 4px; height: 8px; overflow: hidden; }
  .chart-fill { height: 100%; border-radius: 4px; background: var(--accent); transition: width 0.7s cubic-bezier(0.4,0,0.2,1); }
  .chart-val { font-size: 12px; color: var(--text3); font-family: var(--mono); width: 28px; text-align: right; }

  /* ─── Login ──────────────────────────────────────────────── */
  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 60% 50% at 20% 40%, rgba(124,58,237,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 80% 70%, rgba(167,139,250,0.05) 0%, transparent 70%);
  }

  .login-card {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: var(--r-xl);
    padding: 40px 36px;
    width: 360px;
    box-shadow: var(--shadow);
  }

  .login-icon {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    color: white;
    margin-bottom: 24px;
  }

  .login-title {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }

  .login-sub {
    font-size: 13px;
    color: var(--text3);
    margin-bottom: 32px;
  }

  .error-box {
    background: rgba(248,113,113,0.08);
    border: 1px solid rgba(248,113,113,0.2);
    border-radius: var(--r);
    padding: 10px 14px;
    font-size: 13px;
    color: var(--red);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
  }
  .error-box i { font-size: 16px; flex-shrink: 0; }

  .login-note {
    text-align: center;
    font-size: 11px;
    color: var(--text3);
    margin-top: 24px;
    opacity: 0.6;
  }

  /* ─── Charity avatar ─────────────────────────────────────── */
  .entity-avatar {
    width: 34px; height: 34px;
    border-radius: var(--r);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    font-weight: 600;
    background: rgba(167,139,250,0.12);
    color: var(--accent);
    flex-shrink: 0;
  }

  .entity-cell { display: flex; align-items: center; gap: 10px; }
  .entity-name { font-weight: 500; }
  .entity-meta { font-size: 12px; color: var(--text3); margin-top: 1px; }

  /* ─── Utilities ──────────────────────────────────────────── */
  .flex { display: flex; }
  .items-center { align-items: center; }
  .justify-between { justify-content: space-between; }
  .gap-2 { gap: 8px; }
  .gap-3 { gap: 12px; }
  .mt-1 { margin-top: 4px; }
  .mt-2 { margin-top: 8px; }
  .hidden { display: none !important; }

  /* ─── Two-col grid for dashboard ───────────────────────── */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }

  /* ─── Image preview ──────────────────────────────────────── */
  .img-preview {
    margin-top: 8px;
    border-radius: var(--r);
    overflow: hidden;
    border: 1px solid var(--border2);
    max-width: 160px;
  }
  .img-preview img { width: 100%; display: block; }

  /* ─── Separator ─────────────────────────────────────────── */
  .sep { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

  /* ─── Responsive ───────────────────────────────────────── */
  @media (max-width: 1024px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .grid-2 { grid-template-columns: 1fr; }
  }

  @media (max-width: 768px) {
    :root { --sidebar: 0px; }
    .sidebar { display: none; }
    .main { margin-left: 0; padding: 20px 16px; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
    .split-layout { flex-direction: column; }
    .form-panel { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
    .avatar-info { display: none; }
  }
</style>
</head>
<body>

<!-- ══════════════════════════════════════════════════════════
     LOGIN SCREEN
═══════════════════════════════════════════════════════════ -->
<div id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="login-icon"><i class="ti ti-shield-lock"></i></div>
    <h1 class="login-title">Welcome back</h1>
    <p class="login-sub">Sign in to access the admin panel</p>

    <div class="form-group">
      <label class="form-label" for="l-email">Email address</label>
      <input class="form-input" id="l-email" type="email" placeholder="admin@gmail.com" autocomplete="email" />
    </div>

    <div class="form-group">
      <label class="form-label" for="l-pass">Password</label>
      <input class="form-input" id="l-pass" type="password" placeholder="••••••••" autocomplete="current-password" />
    </div>

    <button class="btn btn-primary btn-full" id="do-login">
      <i class="ti ti-login"></i> Sign in
    </button>

    <div id="login-err" class="error-box hidden">
      <i class="ti ti-alert-circle"></i>
      <span>Invalid credentials. Please try again.</span>
    </div>

    <p class="login-note">Demo: admin@gmail.com / 123</p>
  </div>
</div>

     MAIN APP
═══════════════════════════════════════════════════════════ -->

        <span class="nav-badge" id="nb-char">0</span>

      <button class="nav-item">
        <i class="ti ti-users"></i> Users
      </button>
      <button class="nav-item">
        <i class="ti ti-chart-bar"></i> Reports

        <i class="ti ti-settings"></i> Settings

      <div class="sidebar-footer">

    <!-- Main content -->

  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════ */
const state = {
  view: 'dashboard',
  stats: { items: 0, categories: 0, donations: 0, charities: 0 },
  categories: [],
  charities: [],
  catEdit: null,
  catForm: { category_name: '', image: null },
  charEdit: null,
  charForm: { name: '', description: '', address: '', phone: '', email: '' },
};

/* ═══════════════════════════════════════════════════════════
   AUTH
═══════════════════════════════════════════════════════════ */
const $loginScreen = document.getElementById('login-screen');
const $app         = document.getElementById('app');
const $loginErr    = document.getElementById('login-err');

document.getElementById('do-login').addEventListener('click', tryLogin);
document.getElementById('l-pass').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
document.getElementById('l-email').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

function tryLogin() {
  const email = document.getElementById('l-email').value.trim();
  const pass  = document.getElementById('l-pass').value;
  if (email === 'admin@gmail.com' && pass === '123') {
    $loginScreen.classList.add('hidden');
    $app.classList.remove('hidden');
    loadAll().then(() => renderView());
  } else {
    $loginErr.classList.remove('hidden');
  }
}

async function loadAll() {
  await Promise.all([loadStats(), loadCategories(), loadCharities()]);
}

async function loadStats() {
  try {
    const res = await fetch('/admin/stats');
    if (!res.ok) return;
    const j = await res.json();
    if (j && j.data) state.stats = j.data;
  } catch (e) {
    console.error('loadStats error', e);
  }
}

async function loadCategories() {
  try {
    const res = await fetch('/categories');
    if (!res.ok) return;
    const j = await res.json();
    state.categories = j.data || j || [];
  } catch (e) {
    console.error('loadCategories error', e);
  }
}

async function loadCharities() {
  try {
    const res = await fetch('/charities');
    if (!res.ok) return;
    const j = await res.json();
    state.charities = j.data || j || [];
  } catch (e) {
    console.error('loadCharities error', e);
  }
}

function logout() {
  $app.classList.add('hidden');
  $loginScreen.classList.remove('hidden');
  document.getElementById('l-pass').value = '';
  $loginErr.classList.add('hidden');
}

document.getElementById('do-logout').addEventListener('click', logout);
document.getElementById('sb-logout').addEventListener('click', logout);

/* ═══════════════════════════════════════════════════════════
   ROUTING
═══════════════════════════════════════════════════════════ */
function setView(v) {
  state.view = v;
  // reset forms on view change
  state.catEdit = null;
  state.catForm = { category_name: '', image: null };
  state.charEdit = null;
  state.charForm = { name: '', description: '', address: '', phone: '', email: '' };
  renderView();
}

function renderView() {
  updateNavBadges();
  document.querySelectorAll('.nav-item[data-view]').forEach(el => {
    el.classList.toggle('active', el.dataset.view === state.view);
  });
  const content = document.getElementById('main-content');
  switch (state.view) {
    case 'dashboard':  content.innerHTML = renderDashboard();  bindDashboard();  break;
    case 'categories': content.innerHTML = renderCategories(); bindCategories(); break;
    case 'charities':  content.innerHTML = renderCharities();  bindCharities();  break;
  }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-view]');
  if (el && el.classList.contains('nav-item')) setView(el.dataset.view);
});

function updateNavBadges() {
  const nc = document.getElementById('nb-cat');
  const nh = document.getElementById('nb-char');
  if (nc) nc.textContent = state.categories.length;
  if (nh) nh.textContent = state.charities.length;
}

/* ═══════════════════════════════════════════════════════════
   DASHBOARD
═══════════════════════════════════════════════════════════ */
function renderDashboard() {
  const s = state.stats;
  const weekData = [
    { day: 'Mon', val: 68 }, { day: 'Tue', val: 91 }, { day: 'Wed', val: 54 },
    { day: 'Thu', val: 120 },{ day: 'Fri', val: 87 }, { day: 'Sat', val: 43 },
    { day: 'Sun', val: 29 }
  ];
  const maxVal = Math.max(...weekData.map(d => d.val));

  return `
  <div class="page-header">
    <div class="page-title-wrap">
      <h1 class="page-title">Dashboard</h1>
      <p class="page-sub">Platform overview and activity</p>
    </div>
    <button class="btn btn-secondary" id="dash-reload">
      <i class="ti ti-refresh"></i> Refresh
    </button>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-top">
        <div class="stat-icon si-purple"><i class="ti ti-package" aria-hidden="true"></i></div>
        <span class="stat-trend-pill"><i class="ti ti-trending-up"></i> +12%</span>
      </div>
      <div class="stat-num">${s.items.toLocaleString()}</div>
      <div class="stat-label">Total Items</div>
    </div>
    <div class="stat-card">
      <div class="stat-top">
        <div class="stat-icon si-green"><i class="ti ti-tag" aria-hidden="true"></i></div>
        <span class="stat-trend-pill"><i class="ti ti-trending-up"></i> +2</span>
      </div>
      <div class="stat-num">${s.categories}</div>
      <div class="stat-label">Categories</div>
    </div>
    <div class="stat-card">
      <div class="stat-top">
        <div class="stat-icon si-amber"><i class="ti ti-heart-handshake" aria-hidden="true"></i></div>
        <span class="stat-trend-pill"><i class="ti ti-trending-up"></i> +8%</span>
      </div>
      <div class="stat-num">${s.donations.toLocaleString()}</div>
      <div class="stat-label">Donations</div>
    </div>
    <div class="stat-card">
      <div class="stat-top">
        <div class="stat-icon si-blue"><i class="ti ti-building-community" aria-hidden="true"></i></div>
        <span class="stat-trend-pill"><i class="ti ti-trending-up"></i> +3</span>
      </div>
      <div class="stat-num">${s.charities}</div>
      <div class="stat-label">Charities</div>
    </div>
  </div>

  <div class="grid-2">
    <div class="card">
      <div class="card-head">
        <span class="card-title"><i class="ti ti-chart-bar" aria-hidden="true"></i> Weekly donations</span>
      </div>
      <div class="card-body">
        <div class="chart" id="weekly-chart">
          ${weekData.map(d => `
          <div class="chart-row">
            <div class="chart-label">${d.day}</div>
            <div class="chart-track">
              <div class="chart-fill" style="width:0%" data-target="${Math.round(d.val/maxVal*100)}%"></div>
            </div>
            <div class="chart-val">${d.val}</div>
          </div>`).join('')}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="card-title"><i class="ti ti-history" aria-hidden="true"></i> Recent activity</span>
      </div>
      <div class="card-body">
        ${[
          { icon: 'ti-plus',    color: 'green',  text: 'New category added',        sub: '2 min ago' },
          { icon: 'ti-heart',   color: 'red',    text: 'Donation received · $240',   sub: '14 min ago' },
          { icon: 'ti-user',    color: 'blue',   text: 'New charity registered',     sub: '1 hr ago' },
          { icon: 'ti-package', color: 'amber',  text: '34 items donated',           sub: '3 hr ago' },
          { icon: 'ti-check',   color: 'green',  text: 'City Relief approved',       sub: 'Yesterday' },
        ].map(a => `
        <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);">
          <div style="width:32px;height:32px;border-radius:8px;background:rgba(${a.color==='green'?'52,211,153':a.color==='red'?'248,113,113':a.color==='blue'?'96,165,250':'251,191,36'},0.1);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--${a.color});flex-shrink:0;">
            <i class="ti ${a.icon}"></i>
          </div>
          <div style="flex:1;min-width:0;">
            <div style="font-size:13px;font-weight:500;">${a.text}</div>
            <div style="font-size:11px;color:var(--text3);margin-top:1px;">${a.sub}</div>
          </div>
        </div>`).join('')}
      </div>
    </div>
  </div>`;
}

function bindDashboard() {
  // Animate chart bars
  requestAnimationFrame(() => {
    document.querySelectorAll('.chart-fill').forEach(el => {
      setTimeout(() => { el.style.width = el.dataset.target; }, 100);
    });
  });

  document.getElementById('dash-reload').addEventListener('click', () => {
    state.stats.donations += Math.floor(Math.random() * 8) + 1;
    renderView();
  });
}

/* ═══════════════════════════════════════════════════════════
   CATEGORIES
═══════════════════════════════════════════════════════════ */
function renderCategories() {
  const f = state.catForm;
  const isEdit = !!state.catEdit;

  return `
  <div class="page-header">
    <div class="page-title-wrap">
      <h1 class="page-title">Categories</h1>
      <p class="page-sub">${state.categories.length} categories total</p>
    </div>
  </div>

  <div class="card">
    <div class="split-layout">
      <!-- Form -->
      <div class="form-panel">
        <div class="form-title">
          <i class="ti ${isEdit ? 'ti-edit' : 'ti-plus'}"></i>
          ${isEdit ? 'Edit category' : 'New category'}
        </div>

        <div class="form-group">
          <label class="form-label" for="cat-name">Name</label>
          <input class="form-input" id="cat-name" type="text" value="${escHtml(f.category_name)}" placeholder="Category name" />
        </div>

        <div class="form-group">
          <label class="form-label" for="cat-image">Image</label>
          <input class="form-input" id="cat-image" type="file" accept="image/*" />
          ${f.image ? `<div class="img-preview"><img src="${f.image}" alt="Preview" /></div>` : ''}
        </div>

        <div class="form-actions">
          <button class="btn btn-primary" id="cat-submit">
            <i class="ti ${isEdit ? 'ti-check' : 'ti-plus'}"></i>
            ${isEdit ? 'Update' : 'Create'}
          </button>
          ${isEdit ? `<button class="btn btn-ghost" id="cat-cancel">Cancel</button>` : ''}
        </div>
      </div>

      <!-- List -->
      <div class="split-list">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>ID</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${state.categories.length === 0 ? `
              <tr><td colspan="4" style="text-align:center;color:var(--text3);padding:40px;">
                <i class="ti ti-inbox" style="font-size:28px;display:block;margin-bottom:8px;opacity:0.4;"></i>
                No categories yet
              </td></tr>` :
              state.categories.map(c => `
              <tr>
                <td>
                  <div class="entity-cell">
                    ${c.image ? `<img src="${c.image}" style="width:32px;height:32px;border-radius:6px;object-fit:cover;flex-shrink:0;" />` :
                    `<div class="entity-avatar" style="font-size:11px;">${c.category_name[0].toUpperCase()}</div>`}
                    <span style="font-weight:500;">${escHtml(c.category_name)}</span>
                  </div>
                </td>
                <td><span class="id-chip">${c.category_id}</span></td>
                <td><span class="badge badge-${c.status}"><span class="badge-dot"></span>${c.status}</span></td>
                <td>
                  <div class="flex gap-2">
                    <button class="btn btn-ghost btn-sm" data-cat-edit="${c.category_id}">
                      <i class="ti ti-edit"></i> Edit
                    </button>
                    <button class="btn btn-danger" data-cat-del="${c.category_id}">
                      <i class="ti ti-trash"></i>
                    </button>
                  </div>
                </td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>`;
}

function bindCategories() {
  const nameInput = document.getElementById('cat-name');
  if (nameInput) nameInput.addEventListener('input', e => { state.catForm.category_name = e.target.value; });

  const imgInput = document.getElementById('cat-image');
  if (imgInput) imgInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) { state.catForm.image = null; state.catForm._file = null; renderView(); return; }
    state.catForm._file = file;
    const reader = new FileReader();
    reader.onload = () => { state.catForm.image = reader.result; renderView(); };
    reader.readAsDataURL(file);
  });

  const submitBtn = document.getElementById('cat-submit');
  if (submitBtn) submitBtn.addEventListener('click', async () => {
    const name = (document.getElementById('cat-name').value || '').trim();
    if (!name) { document.getElementById('cat-name').focus(); return; }

    try {
      if (state.catEdit) {
        // Update
        const id = state.catEdit;
        if (state.catForm._file) {
          const fd = new FormData();
          fd.append('category_name', name);
          fd.append('image', state.catForm._file);
          await fetch('/categories/' + id, { method: 'PUT', body: fd });
        } else {
          await fetch('/categories/' + id, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ category_name: name }) });
        }
      } else {
        // Create
        if (state.catForm._file) {
          const fd = new FormData();
          fd.append('category_name', name);
          fd.append('image', state.catForm._file);
          await fetch('/categories', { method: 'POST', body: fd });
        } else {
          await fetch('/categories', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ category_name: name }) });
        }
      }
      await loadCategories();
      await loadStats();
      state.catEdit = null;
      state.catForm = { category_name: '', image: null, _file: null };
      renderView();
    } catch (err) {
      console.error('category submit error', err);
    }
  });

  const cancelBtn = document.getElementById('cat-cancel');
  if (cancelBtn) cancelBtn.addEventListener('click', () => {
    state.catEdit = null;
    state.catForm = { category_name: '', image: null, _file: null };
    renderView();
  });

  document.querySelectorAll('[data-cat-edit]').forEach(el => {
    el.addEventListener('click', () => {
      const c = state.categories.find(x => String(x.category_id) === String(el.dataset.catEdit));
      if (!c) return;
      state.catEdit = c.category_id;
      state.catForm = { category_name: c.category_name, image: c.image || null, _file: null };
      renderView();
    });
  });

  document.querySelectorAll('[data-cat-del]').forEach(el => {
    el.addEventListener('click', async () => {
      if (!confirm('Delete this category?')) return;
      try {
        await fetch('/categories/' + el.dataset.catDel, { method: 'DELETE' });
        await loadCategories();
        await loadStats();
        renderView();
      } catch (err) { console.error('delete category', err); }
    });
  });
}

/* ═══════════════════════════════════════════════════════════
   CHARITIES
═══════════════════════════════════════════════════════════ */
function renderCharities() {
  const f = state.charForm;
  const isEdit = !!state.charEdit;

  return `
  <div class="page-header">
    <div class="page-title-wrap">
      <h1 class="page-title">Charities</h1>
      <p class="page-sub">${state.charities.length} charity partners</p>
    </div>
  </div>

  <div class="card">
    <div class="split-layout">
      <!-- Form -->
      <div class="form-panel" style="width:300px;">
        <div class="form-title">
          <i class="ti ${isEdit ? 'ti-edit' : 'ti-heart-plus'}"></i>
          ${isEdit ? 'Edit charity' : 'New charity'}
        </div>

        <div class="form-group">
          <label class="form-label" for="chr-name">Name</label>
          <input class="form-input" id="chr-name" type="text" value="${escHtml(f.name)}" placeholder="Charity name" />
        </div>
        <div class="form-group">
          <label class="form-label" for="chr-email">Email</label>
          <input class="form-input" id="chr-email" type="email" value="${escHtml(f.email)}" placeholder="contact@charity.org" />
        </div>
        <div class="form-group">
          <label class="form-label" for="chr-phone">Phone</label>
          <input class="form-input" id="chr-phone" type="text" value="${escHtml(f.phone)}" placeholder="+1 555 0000" />
        </div>
        <div class="form-group">
          <label class="form-label" for="chr-addr">Address</label>
          <input class="form-input" id="chr-addr" type="text" value="${escHtml(f.address)}" placeholder="Street address" />
        </div>
        <div class="form-group">
          <label class="form-label" for="chr-desc">Description</label>
          <textarea class="form-textarea" id="chr-desc" placeholder="Brief description…">${escHtml(f.description)}</textarea>
        </div>

        <div class="form-actions">
          <button class="btn btn-primary" id="chr-submit">
            <i class="ti ${isEdit ? 'ti-check' : 'ti-plus'}"></i>
            ${isEdit ? 'Update' : 'Create'}
          </button>
          ${isEdit ? `<button class="btn btn-ghost" id="chr-cancel">Cancel</button>` : ''}
        </div>
      </div>

      <!-- List -->
      <div class="split-list">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Charity</th>
                <th>Contact</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${state.charities.length === 0 ? `
              <tr><td colspan="4" style="text-align:center;color:var(--text3);padding:40px;">
                <i class="ti ti-heart-off" style="font-size:28px;display:block;margin-bottom:8px;opacity:0.4;"></i>
                No charities yet
              </td></tr>` :
              state.charities.map(c => `
              <tr>
                <td>
                  <div class="entity-cell">
                    <div class="entity-avatar">${c.name[0].toUpperCase()}</div>
                    <div>
                      <div class="entity-name">${escHtml(c.name)}</div>
                      ${c.description ? `<div class="entity-meta">${escHtml(c.description.slice(0, 40))}${c.description.length > 40 ? '…' : ''}</div>` : ''}
                    </div>
                  </div>
                </td>
                <td>
                  <div style="font-size:12px;color:var(--text2);">${escHtml(c.email)}</div>
                  <div style="font-size:12px;color:var(--text3);margin-top:2px;">${escHtml(c.phone)}</div>
                </td>
                <td><span class="badge badge-${c.status}"><span class="badge-dot"></span>${c.status}</span></td>
                <td>
                  <div class="flex gap-2">
                    <button class="btn btn-ghost btn-sm" data-chr-edit="${c.charity_id}">
                      <i class="ti ti-edit"></i> Edit
                    </button>
                    <button class="btn btn-danger" data-chr-del="${c.charity_id}">
                      <i class="ti ti-trash"></i>
                    </button>
                  </div>
                </td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>`;
}

function bindCharities() {
  const fields = [
    ['chr-name',  'name'],
    ['chr-email', 'email'],
    ['chr-phone', 'phone'],
    ['chr-addr',  'address'],
    ['chr-desc',  'description'],
  ];
  fields.forEach(([id, key]) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', e => { state.charForm[key] = e.target.value; });
  });

  const submitBtn = document.getElementById('chr-submit');
  if (submitBtn) submitBtn.addEventListener('click', async () => {
    const name = (document.getElementById('chr-name').value || '').trim();
    if (!name) { document.getElementById('chr-name').focus(); return; }
    const formData = {
      name:        document.getElementById('chr-name').value.trim(),
      email:       document.getElementById('chr-email').value.trim(),
      phone:       document.getElementById('chr-phone').value.trim(),
      address:     document.getElementById('chr-addr').value.trim(),
      description: document.getElementById('chr-desc').value.trim(),
    };
    try {
      if (state.charEdit) {
        await fetch('/charities/' + state.charEdit, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(formData) });
      } else {
        await fetch('/charities', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(formData) });
      }
      await loadCharities();
      await loadStats();
      state.charEdit = null;
      state.charForm = { name: '', description: '', address: '', phone: '', email: '' };
      renderView();
    } catch (err) { console.error('charity submit', err); }
  });

  const cancelBtn = document.getElementById('chr-cancel');
  if (cancelBtn) cancelBtn.addEventListener('click', () => {
    state.charEdit = null;
    state.charForm = { name: '', description: '', address: '', phone: '', email: '' };
    renderView();
  });

  document.querySelectorAll('[data-chr-edit]').forEach(el => {
    el.addEventListener('click', () => {
      const c = state.charities.find(x => String(x.charity_id) === String(el.dataset.chrEdit));
      if (!c) return;
      state.charEdit = c.charity_id;
      state.charForm = { name: c.name, email: c.email, phone: c.phone, address: c.address || '', description: c.description || '' };
      renderView();
    });
  });

  document.querySelectorAll('[data-chr-del]').forEach(el => {
    el.addEventListener('click', async () => {
      if (!confirm('Delete this charity?')) return;
      try {
        await fetch('/charities/' + el.dataset.chrDel, { method: 'DELETE' });
        await loadCharities();
        await loadStats();
        renderView();
      } catch (err) { console.error('delete charity', err); }
    });
  });
}

/* ═══════════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════════ */
function escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
